<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&amp;display=swap');
      .badge-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.28em;
        fill: #203126;
        text-transform: uppercase;
      }
      .badge-center {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 20px;
        letter-spacing: 0.15em;
        fill: #203126;
      }
    </style>
    <path id="textCircleTop" d="M 50,150 A 100,100 0 0,1 250,150" fill="none" />
    <path id="textCircleBottom" d="M 250,150 A 100,100 0 0,1 50,150" fill="none" />
  </defs>

  <!-- Background -->
  <circle cx="150" cy="150" r="142" fill="#FAF7F2" stroke="#6B8572" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="135" fill="none" stroke="#D48B77" stroke-width="0.8" stroke-dasharray="3 3"/>
  <circle cx="150" cy="150" r="82" fill="none" stroke="#E5DEC9" stroke-width="1"/>

  <!-- Curved Text Along Paths -->
  <text class="badge-text">
    <textPath href="#textCircleTop" xlink:href="#textCircleTop" startOffset="50%" text-anchor="middle">
      • REVIVE THREADS •
    </textPath>
  </text>
  
  <text class="badge-text">
    <textPath href="#textCircleBottom" xlink:href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      CIRCULAR VERIFIED • INDIA
    </textPath>
  </text>

  <!-- Center Icon -->
  <g transform="translate(100, 100) scale(0.5)">
    <!-- Infinity loop -->
    <path d="M 100 100 C 82 68, 50 68, 50 100 C 50 128, 76 136, 100 100 C 124 64, 150 72, 150 100 C 150 132, 118 132, 100 100 Z" 
          fill="none" 
          stroke="#6B8572" 
          stroke-width="4.5" 
          stroke-linecap="round"/>
    <path d="M 100 100 C 76 128, 58 122, 58 100 C 58 82, 80 78, 100 100 C 120 122, 142 118, 142 100 C 142 78, 120 78, 100 100 Z" 
          fill="none" 
          stroke="#D48B77" 
          stroke-width="3" 
          stroke-linecap="round"/>
    <circle cx="100" cy="100" r="8" fill="#FAF7F2" stroke="#203126" stroke-width="3"/>
  </g>
</svg>
