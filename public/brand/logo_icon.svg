<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FA895"/>
      <stop offset="100%" stop-color="#5A7360"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D48B77"/>
      <stop offset="100%" stop-color="#E8A895"/>
    </linearGradient>
  </defs>

  <!-- Background Subtle Circle -->
  <circle cx="250" cy="250" r="230" fill="#FAF7F2" stroke="#E6DFD5" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Outer Delicate Thread Ring -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="#6B8572" stroke-width="1.2" opacity="0.4"/>

  <!-- The Circular Infinity Thread Motif -->
  <!-- Left loop: Sprouting Leaf & Thread Loop -->
  <path d="M 250 250 C 210 180, 140 180, 140 250 C 140 310, 200 330, 250 250 C 300 170, 360 190, 360 250 C 360 320, 290 320, 250 250 Z" 
        fill="none" 
        stroke="url(#sageGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Secondary Counter-Thread (Terracotta accent) -->
  <path d="M 250 250 C 200 310, 160 300, 160 250 C 160 210, 210 200, 250 250 C 290 300, 340 290, 340 250 C 340 200, 290 200, 250 250 Z" 
        fill="none" 
        stroke="url(#terracottaGrad)" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        opacity="0.85"/>

  <!-- Organic Sprout / Leaf Detail on Top Loop -->
  <path d="M 195 215 C 190 190, 170 175, 145 175 C 150 200, 170 215, 195 215 Z" 
        fill="#8FA895" 
        opacity="0.9"/>
  <path d="M 195 215 C 170 195, 145 175, 145 175" 
        stroke="#FCFAF7" 
        stroke-width="1.2" 
        fill="none"/>

  <!-- Thread Needle Symbolism / Spindle Accent -->
  <line x1="250" y1="120" x2="250" y2="380" stroke="#C8A97E" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  
  <!-- Subtle Thread Spool Center Eye -->
  <circle cx="250" cy="250" r="7" fill="#FCFAF7" stroke="#203126" stroke-width="2"/>
  <circle cx="250" cy="250" r="2.5" fill="#D48B77"/>
</svg>
