    // ========================================================
    // CUSTOM LUXURY DROPDOWN (NO UGLY OS NATIVE SELECT POPOVER)
    // ========================================================
    const CustomSelect = ({ value, onChange, options, label, name, className = "", buttonClassName = "", placeholder = "Select option..." }) => {
      const [isOpen, setIsOpen] = useState(false);
      const selectRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (selectRef.current && !selectRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const activeOpt = options.find(o => String(o.value) === String(value)) || options[0] || { label: placeholder, value: "" };

      return (
        <div className={`relative ${className}`} ref={selectRef}>
          {name && <input type="hidden" name={name} value={value} />}
          {label && (
            <label className="block text-xs font-semibold uppercase tracking-wider text-forest/80 mb-2">
              {label}
            </label>
          )}
          <button
            type="button"
            onClick={() => setIsOpen(!isOpen)}
            className={`w-full flex items-center justify-between px-3.5 py-2.5 sm:py-3 text-xs sm:text-sm font-medium text-forest bg-white hover:bg-linen-50/80 border border-linen-300 focus:border-sage-500 rounded-xl transition-all shadow-2xs text-left select-none ${buttonClassName}`}
          >
            <span className="truncate">{activeOpt.label}</span>
            <svg 
              className={`w-4 h-4 text-sage-600 ml-2 shrink-0 transition-transform duration-200 ${isOpen ? 'rotate-180 text-forest' : ''}`} 
              viewBox="0 0 24 24" 
              fill="none" 
              stroke="currentColor" 
              strokeWidth="2" 
              strokeLinecap="round" 
              strokeLinejoin="round"
            >
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>

          {isOpen && (
            <div className="absolute z-50 mt-1.5 w-full min-w-[200px] bg-white rounded-2xl border border-linen-300 shadow-xl py-1.5 max-h-60 overflow-y-auto animate-fadeIn backdrop-blur-md">
              {options.map((opt) => {
                const isSelected = String(opt.value) === String(value);
                return (
                  <div
                    key={opt.value}
                    onClick={() => {
                      onChange(opt.value);
                      setIsOpen(false);
                    }}
                    className={`px-4 py-2.5 text-xs sm:text-sm font-medium cursor-pointer transition-colors flex items-center justify-between ${
                      isSelected 
                        ? 'bg-sage-100 text-forest font-bold' 
                        : 'text-sage-800 hover:bg-linen-100 hover:text-forest'
                    }`}
                  >
                    <span>{opt.label}</span>
                    {isSelected && (
                      <svg className="w-4 h-4 text-forest shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                      </svg>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    // ========================================================
    // ROOT APPLICATION COMPONENT
    // ========================================================
    function App() {
      // Navigation Router State: 'home' | 'shop' | 'rent' | 'atelier' | 'donate' | 'sell' | 'product'
      const [activePage, setActivePage] = useState('home');
      const [selectedProduct, setSelectedProduct] = useState(null);

      // Inventory Data
      const [products, setProducts] = useState(INITIAL_CATALOG);

      // Global Filters
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterMode, setFilterMode] = useState('all');
      const [filterSize, setFilterSize] = useState('all');
      const [filterCondition, setFilterCondition] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('featured');
      const [rentalCategory, setRentalCategory] = useState('all');

      // Cart State
      const [cart, setCart] = useState([INITIAL_CATALOG[0], INITIAL_CATALOG[2]]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);

      // Toast Feedback
      const [toast, setToast] = useState(null);

      const triggerToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Mobile Navigation State
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Sell Page Custom Dropdowns State
      const [sellCategory, setSellCategory] = useState('top');
      const [sellMode, setSellMode] = useState('both');
      const [sellSize, setSellSize] = useState('M');
      const [sellCondition, setSellCondition] = useState('Like New (Pristine)');

      // Donate Page Custom Dropdowns State
      const [donateCity, setDonateCity] = useState('DELHI-NCR');
      const [donatePartner, setDonatePartner] = useState('Goonj — Vastra Samman');

      // Sell Page Interactive Photo Upload State & Handlers
      const [sellPhotos, setSellPhotos] = useState([
        {
          id: 'photo-default-1',
          url: 'https://images.unsplash.com/photo-1534126511673-b6899657816a?q=80&w=700&auto=format&fit=crop',
          label: 'Front View (Primary)'
        },
        {
          id: 'photo-default-2',
          url: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=700&auto=format&fit=crop',
          label: 'Care / Brand Label'
        }
      ]);

      const handlePhotoUpload = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        files.forEach((file, idx) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            setSellPhotos(prev => [
              ...prev,
              {
                id: 'upload-' + Date.now() + '-' + idx,
                url: event.target.result,
                label: `Uploaded Photo #${prev.length + 1}`
              }
            ]);
          };
          reader.readAsDataURL(file);
        });
        triggerToast(`Attached ${files.length} garment photo(s)!`);
      };

      const removePhoto = (id) => {
        if (sellPhotos.length <= 1) {
          triggerToast('Please keep at least 1 photo for listing verification.');
          return;
        }
        setSellPhotos(prev => prev.filter(p => p.id !== id));
      };

      const addPresetPhoto = (url, label) => {
        setSellPhotos(prev => [
          ...prev,
          {
            id: 'preset-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
            url: url,
            label: label
          }
        ]);
        triggerToast(`Added preset: ${label}`);
      };

      // Load products from backend API
      useEffect(() => {
        async function fetchLiveInventory() {
          try {
            const res = await fetch('/api/products');
            if (res.ok) {
              const data = await res.json();
              if (data.products && Array.isArray(data.products) && data.products.length > 0) {
                setProducts(data.products);
              }
            }
          } catch (e) {
            console.log('Using seeded inventory:', e);
          }
        }
        fetchLiveInventory();
      }, []);

      // Scroll to top on page navigation
      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [activePage]);

      // Cart management
      const addToBag = (garment) => {
        if (!cart.some(item => item.id === garment.id)) {
          setCart([...cart, garment]);
          triggerToast(`Added "${garment.title}" to your circular bag!`);
        } else {
          triggerToast(`"${garment.title}" is already in your bag!`);
        }
      };

      const removeFromBag = (id) => {
        setCart(cart.filter(item => item.id !== id));
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + (item.price || item.rental_price_3_day || 0), 0);
      const cartTotal = cartSubtotal > 0 ? cartSubtotal + 50 : 0;

      // Filtered catalog
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          if (filterCategory !== 'all' && p.category !== filterCategory) return false;
          if (filterMode === 'buy') {
            if (p.listing_mode !== 'buy' && p.listing_mode !== 'both' && p.type !== 'thrift') return false;
          } else if (filterMode === 'rent') {
            if (p.listing_mode !== 'rent' && p.listing_mode !== 'both' && p.type !== 'rental') return false;
          } else if (filterMode === 'both') {
            if (p.listing_mode !== 'both') return false;
          }
          if (filterSize !== 'all' && !p.size.includes(filterSize)) return false;
          if (filterCondition !== 'all' && p.condition !== filterCondition) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const match = p.title.toLowerCase().includes(q) ||
                          (p.fabric && p.fabric.toLowerCase().includes(q)) ||
                          (p.seller && p.seller.toLowerCase().includes(q));
            if (!match) return false;
          }
          return true;
        }).sort((a, b) => {
          if (sortBy === 'price-low') return (a.price || a.rental_price_3_day || 0) - (b.price || b.rental_price_3_day || 0);
          if (sortBy === 'price-high') return (b.price || b.rental_price_3_day || 0) - (a.price || a.rental_price_3_day || 0);
          if (sortBy === 'savings') {

          }
          return 0;

                            { value: 'Gently Loved', label: 'Gently Loved (Clean, no defects)' }
                          ]}
                        />
                        <div>
                          <label className="block text-xs font-semibold uppercase tracking-wider text-forest/80 mb-2">Wear & Care Notes</label>
                          <input name="notes" defaultValue="Worn once for a family dinner, steam sanitized, immaculate condition." className="w-full px-4 py-3 text-sm bg-linen-50/50 border border-linen-300 rounded-xl focus:outline-none focus:border-sage-500 focus:ring-1 focus:ring-sage-500 shadow-2xs" />
                        </div>
                      </div>
                    </div>

                    {/* Section 6: Escrow Protection Notice */}
                    <div className="p-5 bg-sage-50 border border-sage-200 rounded-2xl text-sage-900 text-xs sm:text-sm flex items-start gap-3">
                      <Icon name="shield" className="w-5 h-5 text-sage-600 shrink-0 mt-0.5" />
                      <div>
                        <strong>Physical Quality Check & Escrow Payout:</strong> Every garment is collected by courier and inspected across 5 quality parameters before going live. You receive 82% of sale proceeds safely deposited into your bank account within 24 hours of delivery.
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-4 bg-forest hover:bg-sage-900 text-white font-semibold rounded-2xl text-sm shadow-md transition-all flex items-center justify-center gap-2"
                    >
                      <Icon name="check" className="w-5 h-5 text-emerald-400" />
                      <span>Submit Garment for Listing Approval →</span>
                    </button>

                  </form>

                </div>

              </div>
            )}

            {/* ---------------- PAGE 7: PRODUCT DETAIL VIEW ---------------- */}
            {activePage === 'product' && selectedProduct && (
              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                <button
                  onClick={() => setActivePage('shop')}
                  className="mb-6 text-xs font-semibold text-sage-700 hover:text-forest flex items-center gap-1.5"
                >
                  <span>← Back to Wardrobe</span>
                </button>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start bg-white p-8 sm:p-12 rounded-3xl border border-linen-300 shadow-sm">
                  
                  <div className="lg:col-span-6 rounded-2xl overflow-hidden bg-linen-100 border border-linen-200">
                    <img src={selectedProduct.image} alt={selectedProduct.title} className="w-full h-[520px] object-cover object-top" />
                  </div>

                  <div className="lg:col-span-6 space-y-6 text-xs">
                    <div>
                      <div className="flex items-center gap-2 mb-2">
                        <span className="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-sage-100 text-sage-800">
                          {selectedProduct.listing_mode === 'both' ? 'Buy or Rent' : selectedProduct.listing_mode === 'rent' ? 'Occasion Rental' : 'Thrift Resale'}
                        </span>
                        <span className="text-sage-600 font-semibold">• {selectedProduct.condition}</span>
                      </div>

                      <h1 className="font-cormorant text-3xl sm:text-4xl text-forest font-normal leading-tight">
                        {selectedProduct.title}
                      </h1>

                      <div className="flex items-baseline gap-3 mt-3">
                        <span className="text-3xl font-bold text-forest">₹{(selectedProduct.price || selectedProduct.rental_price_3_day).toLocaleString('en-IN')}</span>
                        {selectedProduct.listing_mode === 'rent' && <span className="text-xs text-sage-600">/ 3-day rental</span>}
                        <span className="text-base text-sage-500 line-through">MRP ₹{selectedProduct.mrp.toLocaleString('en-IN')}</span>
                        <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">
                          Save {Math.round(((selectedProduct.mrp - (selectedProduct.price || selectedProduct.rental_price_3_day)) / selectedProduct.mrp) * 100)}%
                        </span>
                      </div>
                    </div>

                    <p className="text-sm text-sage-700 leading-relaxed">
                      {selectedProduct.description}
                    </p>

                    <div className="p-4 bg-linen-50 rounded-2xl border border-linen-200 space-y-2 text-sage-800">
                      <div className="font-bold text-forest text-xs">Verified Garment Specifications:</div>
                      <div>• <strong>Fabric:</strong> {selectedProduct.fabric}</div>
                      <div>• <strong>Size:</strong> {selectedProduct.size}</div>
                      <div>• <strong>Seller:</strong> {selectedProduct.seller}</div>
                    </div>

                    <div className="grid grid-cols-2 gap-3 text-emerald-900">
                      <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200 flex items-center gap-2">
                        <Icon name="droplet" className="w-5 h-5 text-emerald-600 shrink-0" />
                        <div>
                          <div className="font-bold text-xs">{selectedProduct.water_saved || '2,400 L'}</div>
                          <div className="text-[10px] text-emerald-700">Freshwater Conserved</div>
                        </div>
                      </div>
                      <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200 flex items-center gap-2">
                        <Icon name="shield" className="w-5 h-5 text-emerald-600 shrink-0" />
                        <div>
                          <div className="font-bold text-xs">100% Escrow</div>
                          <div className="text-[10px] text-emerald-700">Payment Protected</div>
                        </div>
                      </div>
                    </div>

                    <button
                      onClick={() => { addToBag(selectedProduct); setIsCartOpen(true); }}
                      className="w-full py-4 bg-forest hover:bg-sage-900 text-white font-semibold rounded-2xl text-xs shadow-md transition-all flex items-center justify-center gap-2"
                    >
                      <Icon name="bag" className="w-4 h-4 text-sage-300" />
                      <span>Add to Circular Bag →</span>
                    </button>
                  </div>

                </div>
              </div>
            )}

          </main>

          {/* ======================================================== */}
          {/* 4. SHOPPING BAG SLIDE-OVER DRAWER */}
          {/* ======================================================== */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex">
              <div className="fixed inset-0 bg-forest/40 backdrop-blur-xs" onClick={() => setIsCartOpen(false)}></div>
              <div className="relative ml-auto max-w-md w-full bg-white shadow-2xl flex flex-col justify-between p-6 z-10">
                <div>
                  <div className="flex items-center justify-between border-b border-linen-200 pb-4">
                    <div className="flex items-center gap-2">
                      <Icon name="bag" className="w-5 h-5 text-forest" />
                      <h3 className="font-cormorant text-2xl text-forest">Your Circular Bag</h3>
                    </div>
                    <button onClick={() => setIsCartOpen(false)} className="text-sage-500 hover:text-forest p-1">
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="py-4 space-y-3 max-h-[60vh] overflow-y-auto">
                    {cart.length === 0 ? (
                      <div className="text-center py-10 text-sage-500">
                        <Icon name="bag" className="w-8 h-8 mx-auto mb-2 text-sage-300" />
                        <p className="text-xs">Your bag is empty.</p>
                      </div>
                    ) : (
                      cart.map(item => (
                        <div key={item.id} className="flex items-center gap-3 p-3 bg-linen-50 rounded-2xl border border-linen-200">
                          <img src={item.image} alt={item.title} className="w-14 h-14 object-cover rounded-xl" />
                          <div className="flex-1">
                            <h4 className="font-semibold text-xs text-forest line-clamp-1">{item.title}</h4>
                            <div className="text-[10px] text-sage-600">Size: {item.size} • {item.condition}</div>
                            <div className="text-xs font-bold text-forest mt-0.5">₹{(item.price || item.rental_price_3_day).toLocaleString('en-IN')}</div>
                          </div>
                          <button onClick={() => removeFromBag(item.id)} className="text-sage-400 hover:text-red-600 p-1">
                            <Icon name="trash" className="w-4 h-4" />
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                <div className="border-t border-linen-200 pt-4 space-y-2.5 text-xs">
                  <div className="flex justify-between text-sage-700">
                    <span>Subtotal:</span>
                    <span className="font-mono font-semibold text-forest">₹{cartSubtotal.toLocaleString('en-IN')}</span>
                  </div>
                  <div className="flex justify-between text-sage-700">
                    <span>Escrow Protection:</span>
                    <span className="font-mono text-emerald-700 font-semibold">FREE (Guaranteed)</span>
                  </div>
                  <div className="flex justify-between text-sage-700">
                    <span>Eco Shipping & Sanitization:</span>
                    <span className="font-mono text-forest">₹50</span>
                  </div>
                  <div className="flex justify-between text-sm font-bold text-forest border-t border-linen-200 pt-2">
                    <span>Total Payable:</span>
                    <span className="font-mono text-base text-forest">₹{cartTotal.toLocaleString('en-IN')}</span>
                  </div>

                  <button
                    disabled={cart.length === 0}
                    onClick={() => { setIsCartOpen(false); setIsCheckoutOpen(true); }}
                    className="w-full py-3 bg-forest hover:bg-sage-900 disabled:opacity-50 text-white font-semibold rounded-xl transition-all shadow-md mt-2 flex items-center justify-center gap-2"
                  >
                    <Icon name="lock" className="w-4 h-4 text-sage-300" />
                    <span>Proceed to Escrow Checkout →</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* 5. ESCROW CHECKOUT MODAL */}
          {/* ======================================================== */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 bg-forest/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full border border-linen-300 shadow-2xl p-6 sm:p-8 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-linen-200 pb-3">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-sage-600">Secure Escrow Checkout</span>
                    <h3 className="font-cormorant text-2xl text-forest">Delivery & Payment</h3>
                  </div>
                  <button onClick={() => setIsCheckoutOpen(false)} className="text-sage-500 hover:text-forest p-1">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={async (e) => {
                  e.preventDefault();
                  const form = e.target;
                  try {
                    await fetch('/api/orders', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                        customer_name: form.name.value,
                        customer_phone: form.phone.value,
                        customer_email: form.email.value,
                        shipping_address: form.address.value,
                        item_id: cart[0]?.id || 'prod-101',
                        item_title: cart[0]?.title || 'Circular Garment Order',
                        order_type: 'buy',
                        total_amount: cartTotal,
                        deposit_amount: 0
                      })
                    });
                  } catch (err) {}

                  setIsCheckoutOpen(false);
                  setCart([]);
                  triggerToast('Order confirmed with Escrow Protection! Tracking link dispatched via SMS.');
                  setActivePage('home');
                }} className="space-y-4 text-xs">
                  <div>
                    <label className="block font-semibold text-forest mb-1">Full Name</label>
                    <input name="name" required defaultValue="Sneha Nair" className="w-full px-3 py-2 border border-linen-300 rounded-xl" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-semibold text-forest mb-1">Phone Number</label>
                      <input name="phone" required defaultValue="+91 99201 33451" className="w-full px-3 py-2 border border-linen-300 rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-semibold text-forest mb-1">Email</label>
                      <input name="email" type="email" required defaultValue="sneha.nair@gmail.com" className="w-full px-3 py-2 border border-linen-300 rounded-xl" />
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-forest mb-1">Delivery Address</label>
                    <textarea name="address" required rows="2" defaultValue="Flat 402, Green Glen Layout, Bellandur, Bengaluru - 560103" className="w-full px-3 py-2 border border-linen-300 rounded-xl"></textarea>
                  </div>

                  <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-900 text-[11px] leading-snug">
                    <strong>100% Escrow Protection:</strong> Funds are held securely in Escrow until you receive and inspect your items.
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3.5 bg-forest hover:bg-sage-900 text-white font-semibold rounded-xl transition-all shadow-md flex items-center justify-center gap-2 text-xs"
                  >
                    <Icon name="lock" className="w-4 h-4 text-sage-300" />
                    <span>Confirm Order & Lock in Escrow (₹{cartTotal.toLocaleString('en-IN')})</span>
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* 6. BRAND FOOTER (PURE CONSUMER BRAND) */}
          {/* ======================================================== */}
          <footer className="bg-forest text-linen-100 border-t border-sage-800 pt-12 pb-8">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8 pb-8 border-b border-sage-800 text-xs">
                <div className="space-y-3 md:col-span-1">
                  <div className="font-cormorant text-2xl tracking-widest text-white">REVIVE THREADS</div>
                  <p className="text-sage-300 leading-relaxed text-[11px]">
                    India's unified circular fashion ecosystem. Eliminating wardrobe waste through verified peer-to-peer thrifting, occasion rentals, master artisan upcycling, and NGO partnerships.
                  </p>
                  <div className="text-[11px] text-sage-400">
                    🌱 100% Escrow Protected Transactions
                  </div>
                </div>

                <div className="space-y-2">
                  <div className="font-bold text-white uppercase tracking-wider text-[11px]">Shop Wardrobe</div>
                  <ul className="space-y-1.5 text-sage-300">
                    <li><button onClick={() => { setFilterCategory('top'); setFilterMode('buy'); setActivePage('shop'); }} className="hover:text-white">Daily Tops & Blouses</button></li>
                    <li><button onClick={() => { setFilterCategory('skirt'); setFilterMode('buy'); setActivePage('shop'); }} className="hover:text-white">Pleated Midi Skirts</button></li>
                    <li><button onClick={() => { setFilterCategory('dress'); setFilterMode('buy'); setActivePage('shop'); }} className="hover:text-white">Midi & Maxi Dresses</button></li>
                    <li><button onClick={() => { setFilterCategory('shirt'); setFilterMode('buy'); setActivePage('shop'); }} className="hover:text-white">Men's Linen Shirts</button></li>
                  </ul>
                </div>

                <div className="space-y-2">
                  <div className="font-bold text-white uppercase tracking-wider text-[11px]">Circular Services</div>
                  <ul className="space-y-1.5 text-sage-300">
                    <li><button onClick={() => setActivePage('rent')} className="hover:text-white">Occasion & Bridal Rentals</button></li>
                    <li><button onClick={() => setActivePage('atelier')} className="hover:text-white">Revive Atelier (Saree Upcycling)</button></li>
                    <li><button onClick={() => setActivePage('donate')} className="hover:text-white">Doorstep NGO Donation (Goonj)</button></li>
                    <li><button onClick={() => setActivePage('sell')} className="hover:text-white">Sell or Consign Clothes</button></li>
                  </ul>
                </div>

                <div className="space-y-2">
                  <div className="font-bold text-white uppercase tracking-wider text-[11px]">Quality & Hygiene Guarantee</div>
                  <p className="text-[11px] text-sage-300 leading-relaxed">
                    Every garment is inspected across 5 quality parameters and undergoes medical-grade ozone steam sanitization before dispatch.
                  </p>
                  <div className="text-emerald-400 font-semibold text-[11px]">
                    14,280+ Garments Diverted From Landfills
                  </div>
                </div>
              </div>

              <div className="pt-6 flex flex-col sm:flex-row items-center justify-between text-[11px] text-sage-400 gap-2">
                <div>© 2026 Revive Threads Technologies Pvt. Ltd. All rights reserved.</div>
                <div className="flex items-center gap-4">
                  <span>Ozone Sanitized</span>
                  <span>•</span>
                  <span>Escrow Protected</span>
                  <span>•</span>
                  <span>Zero Fast-Fashion Waste</span>
                </div>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
