        content: `

      }
    ];

    let currentSlideIndex = 0;

    function renderSlide(index) {
      if (index < 0) index = 0;
      if (index >= SLIDES.length) index = SLIDES.length - 1;
      currentSlideIndex = index;

      const slide = SLIDES[currentSlideIndex];
      const stage = document.getElementById('slide-stage');
      const counter = document.getElementById('slide-counter');

      counter.innerText = `Slide ${slide.num} / ${SLIDES.length}`;

      stage.innerHTML = `
        <div>
          <div class="flex items-center justify-between border-b border-linen-300 pb-3 mb-4">
            <span class="text-[10px] font-bold uppercase tracking-widest text-terracotta-600">${slide.tag}</span>
            <span class="text-xs font-mono text-sage-500">REVIVE THREADS &bull; INVESTOR MEMORANDUM</span>
          </div>

          <h2 class="font-serif text-3xl sm:text-4xl text-forest font-light leading-tight">${slide.title}</h2>
          <p class="text-xs sm:text-sm text-sage-600 mt-1 mb-4">${slide.subtitle}</p>

          <div>${slide.content}</div>
        </div>

        <div class="pt-4 border-t border-linen-200 flex justify-between items-center text-[11px] text-sage-500 mt-4">
          <span>Prepared by: Sakshi Kore | Arpita Jadhav | Yashika Thakur</span>
          <span>Slide ${slide.num} of ${SLIDES.length}</span>
        </div>
      `;

      renderDots();
      lucide.createIcons();
    }

    function renderDots() {
      const container = document.getElementById('dots-container');
      container.innerHTML = SLIDES.map((s, idx) => `
        <button onclick="goToSlide(${idx})" class="w-6 h-6 rounded-full text-[10px] font-bold flex items-center justify-center transition-all ${idx === currentSlideIndex ? 'bg-terracotta-500 text-white shadow-xs' : 'bg-sage-800 text-sage-300 hover:bg-sage-700'}">
          ${s.num}
        </button>
      `).join('');
    }

    function nextSlide() {
      if (currentSlideIndex < SLIDES.length - 1) renderSlide(currentSlideIndex + 1);
    }
    function prevSlide() {
      if (currentSlideIndex > 0) renderSlide(currentSlideIndex - 1);
    }
    function goToSlide(idx) {
      renderSlide(idx);
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderSlide(0);
    });
  </script>
