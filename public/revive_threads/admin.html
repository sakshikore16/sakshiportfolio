<body class="bg-[#FAF7F2] text-forest font-sans min-h-screen flex flex-col antialiased selection:bg-sage-200">
  
  <!-- Root React Mount Container -->

  <!-- React JSX Application Code -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ========================================================
    // 1. ADMIN NAVBAR (REACT COMPONENT)
    // ========================================================

                  <path d="M 50 50 C 38 66, 28 62, 28 50 C 28 40, 40 38, 50 50 C 60 62, 72 58, 72 50 C 72 38, 60 38, 50 50 Z" fill="none" stroke="#D48B77" strokeWidth="2.5" strokeLinecap="round"/>

                  <span className="hidden sm:inline-block text-[9px] uppercase tracking-widest px-2 py-0.5 rounded-full bg-sage-800 border border-sage-600 text-sage-300 font-semibold font-sans">

            {/* Nav Tabs Pill */}
            <nav className="hidden lg:flex items-center gap-1.5 bg-sage-900/90 p-1.5 rounded-full border border-sage-700/80 text-xs shadow-inner">
              <button

                className={`px-4 py-2 rounded-full transition-all flex items-center gap-2 ${
                  activeTab === 'approvals'

              >

              <button

              >
                <span>Live Orders</span>
                <span className="bg-sage-700 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">

              <button

              <button

                className={`px-4 py-2 rounded-full transition-all flex items-center gap-2 ${
                  activeTab === 'atelier' 
                    ? 'bg-white text-forest shadow-sm font-semibold'

              >

            {/* Quick Actions & Links */}
            <div className="flex items-center gap-2 sm:gap-3 text-xs shrink-0">
              <button

                className="px-3.5 py-2 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold flex items-center gap-1.5 shadow-sm transition-all hover:scale-105 active:scale-95"
              >
                <span>+ Quick List Garment</span>
              </button>

              <a 
                href="./index.html" 
                className="px-3 py-2 rounded-full bg-sage-800/90 hover:bg-sage-700 text-sage-100 flex items-center gap-1.5 border border-sage-600/60 transition-all"
              >
                <span className="hidden md:inline font-medium">Storefront ↗</span>
              </a>

              <a 
                href="./pitch.html" 
                className="px-3 py-2 rounded-full bg-[#E07A5F] hover:bg-[#C86445] text-white font-medium flex items-center gap-1.5 shadow-2xs transition-all"
              >
                <span className="hidden md:inline">Pitch Deck (PPT) ↗</span>
              </a>

              <a 
                href="./documents.html" 
                className="px-3 py-2 rounded-full bg-terracotta-600 hover:bg-terracotta-500 text-white font-medium flex items-center gap-1.5 shadow-2xs transition-all"
              >
                <span className="hidden md:inline">Analytics & PRD ↗</span>
              </a>
            </div>

          </div>

          {/* Mobile Tab Bar */}
          <div className="lg:hidden flex items-center gap-1 px-4 py-2 bg-sage-900 border-t border-sage-800 overflow-x-auto no-scrollbar text-xs">
            <button
              onClick={() => setActiveTab('approvals')}
              className={`px-3 py-1.5 rounded-full whitespace-nowrap ${
                activeTab === 'approvals' ? 'bg-white text-forest font-semibold' : 'text-sage-300 font-medium'
              }`}
            >
              Approvals ({pendingCount})
            </button>
            <button
              onClick={() => setActiveTab('orders')}
              className={`px-3 py-1.5 rounded-full whitespace-nowrap ${
                activeTab === 'orders' ? 'bg-white text-forest font-semibold' : 'text-sage-300 font-medium'
              }`}
            >
              Orders ({ordersCount})
            </button>
            <button
              onClick={() => setActiveTab('inventory')}
              className={`px-3 py-1.5 rounded-full whitespace-nowrap ${
                activeTab === 'inventory' ? 'bg-white text-forest font-semibold' : 'text-sage-300 font-medium'
              }`}
            >
              Catalog ({inventoryCount})
            </button>
            <button
              onClick={() => setActiveTab('atelier')}
              className={`px-3 py-1.5 rounded-full whitespace-nowrap ${
                activeTab === 'atelier' ? 'bg-white text-forest font-semibold' : 'text-sage-300 font-medium'
              }`}
            >

          </div>
        </header>
      );
    }

    // ========================================================
    // 2. KPI METRICS CARDS (REACT COMPONENT)
    // ========================================================
    function KpiMetrics({ stats }) {
      return (
        <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            
            <div className="bg-white p-5 rounded-3xl border border-linen-300 shadow-xs hover:border-sage-400 transition-all">
              <div className="flex items-center justify-between text-xs text-sage-600 font-semibold mb-2">
                <span>Pending Approvals</span>
                <span className="w-7 h-7 rounded-full bg-terracotta-50 text-terracotta-600 flex items-center justify-center font-bold text-xs">
                  ⏳
                </span>
              </div>
              <div className="text-3xl font-bold text-forest font-serif">
                {stats.pending_approvals_count ?? 3}
              </div>
              <div className="text-[11px] text-terracotta-700 font-medium mt-1 flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-terracotta-500 animate-pulse"></span>
                <span>Requires condition &amp; pricing review</span>
              </div>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-linen-300 shadow-xs hover:border-sage-400 transition-all">
              <div className="flex items-center justify-between text-xs text-sage-600 font-semibold mb-2">
                <span>Active Store Inventory</span>
                <span className="w-7 h-7 rounded-full bg-sage-50 text-sage-600 flex items-center justify-center font-bold text-xs">
                  👗
                </span>
              </div>
              <div className="text-3xl font-bold text-forest font-serif">
                {stats.active_inventory_count ?? 24}
              </div>
              <div className="text-[11px] text-emerald-700 font-medium mt-1 flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                <span>Live across Buy &amp; Occasion Rent</span>
              </div>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-linen-300 shadow-xs hover:border-sage-400 transition-all">
              <div className="flex items-center justify-between text-xs text-sage-600 font-semibold mb-2">
                <span>Total Platform GMV</span>
                <span className="w-7 h-7 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-xs">
                  📈
                </span>
              </div>
              <div className="text-3xl font-bold text-forest font-serif">
                ₹{(stats.total_gmv_inr ?? 48250).toLocaleString('en-IN')}
              </div>
              <div className="text-[11px] text-emerald-700 font-medium mt-1">
                Pre-loved sale &amp; rental combined
              </div>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-linen-300 shadow-xs hover:border-sage-400 transition-all">
              <div className="flex items-center justify-between text-xs text-sage-600 font-semibold mb-2">
                <span>Net Take Revenue</span>
                <span className="w-7 h-7 rounded-full bg-sage-50 text-sage-600 flex items-center justify-center font-bold text-xs">
                  💼
                </span>
              </div>
              <div className="text-3xl font-bold text-forest font-serif">
                ₹{(stats.platform_commission_inr ?? 10615).toLocaleString('en-IN')}
              </div>
              <div className="text-[11px] text-sage-600 font-medium mt-1">
                22% average circular take-rate
              </div>
            </div>

          </div>
        </section>
      );
    }

    // ========================================================
    // 3. APPROVALS TAB (REACT COMPONENT)
    // ========================================================
    function ApprovalsTab({
      pendingRequests,
      pendingFilterMode,
      setPendingFilterMode,
      pendingSearch,
      setPendingSearch,
      onRefresh,
      onApprove,
      onOpenRejectModal,
      onOpenQuickConsign
    }) {
      const [calibratedPrices, setCalibratedPrices] = useState({});
      const [calibratedRentals, setCalibratedRentals] = useState({});
      const [calibratedNotes, setCalibratedNotes] = useState({});
      const [activeImgIndex, setActiveImgIndex] = useState({});

      const handlePriceChange = (id, val) => {
        setCalibratedPrices(prev => ({ ...prev, [id]: Number(val) }));
      };
      const handleRentalChange = (id, val) => {
        setCalibratedRentals(prev => ({ ...prev, [id]: Number(val) }));
      };
      const handleNotesChange = (id, val) => {
        setCalibratedNotes(prev => ({ ...prev, [id]: val }));
      };

      return (
        <section className="space-y-6">
          <div className="bg-white p-6 rounded-3xl border border-linen-300 shadow-xs space-y-4">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="inline-flex items-center gap-1.5 px-3 py-1 bg-terracotta-50 text-terracotta-700 rounded-full text-xs font-semibold uppercase tracking-wider mb-1">
                  <span>5-Point Physical Inspection Engine</span>
                </div>
                <h2 className="font-serif text-3xl text-forest font-normal">Pending Seller Submissions</h2>
                <p className="text-xs text-sage-600 mt-0.5">
                  Review seller photos, inspect condition, calibrate live selling/rental pricing, and approve for instant customer listing.
                </p>
              </div>
              
              <div className="flex items-center gap-2 self-start md:self-center">
                <button
                  onClick={onRefresh}
                  className="px-4 py-2 bg-linen-100 hover:bg-linen-200 text-forest rounded-full text-xs font-semibold flex items-center gap-2 border border-linen-300 transition-all shadow-2xs"
                >
                  <span>↻ Refresh</span>
                </button>
                <button
                  onClick={onOpenQuickConsign}
                  className="px-4 py-2 bg-forest hover:bg-sage-900 text-white rounded-full text-xs font-semibold flex items-center gap-2 transition-all shadow-2xs"
                >
                  <span>+ Direct Add Garment</span>
                </button>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row items-center gap-3 pt-3 border-t border-linen-200">
              <div className="relative w-full sm:w-80">
                <input
                  type="text"
                  value={pendingSearch}
                  onChange={(e) => setPendingSearch(e.target.value)}
                  placeholder="Search by seller, title, phone..."
                  className="w-full px-4 py-2 text-xs bg-linen-50/70 border border-linen-300 rounded-full focus:outline-none focus:border-sage-500 font-sans"
                />
              </div>
              <div className="flex items-center gap-1.5 w-full sm:w-auto overflow-x-auto no-scrollbar">
                {['all', 'buy', 'rent', 'both'].map((m) => (
                  <button
                    key={m}
                    onClick={() => setPendingFilterMode(m)}
                    className={`px-3 py-1.5 rounded-full text-xs transition-all ${
                      pendingFilterMode === m
                        ? 'bg-forest text-white font-bold'
                        : 'text-sage-700 bg-linen-100 hover:bg-linen-200 font-semibold'
                    }`}
                  >
                    {m === 'all' ? 'All Modes' : m === 'buy' ? 'Buy Only' : m === 'rent' ? 'Rent Only' : 'Dual Mode'}
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="space-y-6">
            {pendingRequests.length === 0 ? (
              <div className="bg-white p-14 text-center rounded-3xl border border-linen-300 space-y-3">
                <div className="text-3xl">✅</div>
                <h3 className="font-serif text-3xl text-forest">All submissions reviewed!</h3>
                <p className="text-xs text-sage-600 max-w-sm mx-auto">
                  No seller requests match this criteria. New incoming submissions will appear here automatically.
                </p>
              </div>
            ) : (
              pendingRequests.map((r) => {
                const isRent = r.listing_mode === 'rent';
                const isBoth = r.listing_mode === 'both';

                const activePrice = calibratedPrices[r.id] ?? (r.suggested_admin_price || r.seller_asked_price || 0);
                const activeRental = calibratedRentals[r.id] ?? (r.suggested_admin_rental_price || r.seller_asked_rental_price || 0);
                const activeNote = calibratedNotes[r.id] ?? (r.admin_notes || 'Condition verified across 5 parameters. Sanitized and approved.');

                const sellerPayout = Math.round(activePrice * 0.82);
                const platformMargin = Math.round(activePrice * 0.18);

                const selectedImgIdx = activeImgIndex[r.id] ?? 0;
                const currentImg = r.images && r.images[selectedImgIdx] ? r.images[selectedImgIdx] : (r.image || '');

                return (
                  <div key={r.id} className="bg-white rounded-3xl border border-linen-300 shadow-sm overflow-hidden p-6 sm:p-8 transition-all hover:border-sage-400">
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                      
                      {/* Photo Column */}
                      <div className="lg:col-span-4 space-y-3">
                        <div className="relative rounded-2xl overflow-hidden border border-linen-300 bg-linen-100">
                          <img src={currentImg} alt={r.title} className="w-full h-72 object-cover object-top" />
                          <div className="absolute top-3 left-3 flex flex-col gap-1">
                            <span className={`text-[9px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full shadow-xs ${
                              isRent ? 'bg-purple-900 text-white' : isBoth ? 'bg-amber-100 text-amber-900 border border-amber-300' : 'bg-forest text-white'
                            }`}>
                              {isBoth ? '🔄 BUY & RENT' : isRent ? '👑 RENT ONLY' : '🛒 BUY ONLY'}
                            </span>
                          </div>
                        </div>

                        {r.images && r.images.length > 1 && (
                          <div className="flex gap-2 overflow-x-auto pb-1">
                            {r.images.map((img, idx) => (
                              <img
                                key={idx}
                                src={img}
                                onClick={() => setActiveImgIndex(prev => ({ ...prev, [r.id]: idx }))}
                                alt="thumbnail"
                                className={`w-14 h-14 object-cover rounded-xl border cursor-pointer shrink-0 transition-all ${
                                  selectedImgIdx === idx ? 'border-forest ring-2 ring-forest/30 scale-105' : 'border-linen-300 hover:border-sage-500'
                                }`}
                              />
                            ))}
                          </div>
                        )}

                        <div className="flex items-center justify-between text-[11px] text-sage-600 bg-linen-50 p-2.5 rounded-xl border border-linen-200">
                          <span>{(r.images || []).length} verification photo(s)</span>
                          <span className="font-semibold text-emerald-700">✓ High-Res Evidence</span>
                        </div>
                      </div>

                      {/* Details Column */}
                      <div className="lg:col-span-4 space-y-4">
                        <div>
                          <div className="text-[10px] font-bold uppercase tracking-wider text-sage-500 flex items-center gap-1.5 mb-1">
                            <span className="px-2 py-0.5 rounded bg-linen-200 text-forest font-semibold">{r.category.toUpperCase()}</span>
                            <span>&bull;</span>
                            <span>Submitted: {new Date(r.submitted_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })}</span>
                          </div>
                          <h3 className="font-serif text-2xl text-forest font-medium leading-snug">{r.title}</h3>
                        </div>

                        <div className="p-3 bg-linen-50 rounded-2xl border border-linen-200 text-xs space-y-1">
                          <div className="font-semibold text-forest">Seller Condition Statement:</div>
                          <div className="text-terracotta-700 font-bold">{r.condition}</div>
                          <p className="text-sage-700 italic">"{r.condition_notes || 'Clean, intact garment.'}"</p>
                        </div>

                        <div className="grid grid-cols-2 gap-2 text-xs text-sage-700">
                          <div className="p-2.5 bg-white rounded-xl border border-linen-200">
                            <div className="text-[10px] uppercase font-bold text-sage-500">Fabric</div>
                            <div className="font-medium text-forest truncate">{r.fabric || 'Pure Cotton'}</div>
                          </div>
                          <div className="p-2.5 bg-white rounded-xl border border-linen-200">
                            <div className="text-[10px] uppercase font-bold text-sage-500">Size</div>
                            <div className="font-medium text-forest">{r.size}</div>
                          </div>
                          <div className="p-2.5 bg-white rounded-xl border border-linen-200">
                            <div className="text-[10px] uppercase font-bold text-sage-500">Retail MRP</div>
                            <div className="font-bold text-forest">₹{r.mrp.toLocaleString('en-IN')}</div>
                          </div>
                          <div className="p-2.5 bg-white rounded-xl border border-linen-200">
                            <div className="text-[10px] uppercase font-bold text-sage-500">Seller Asking</div>
                            <div className="font-bold text-terracotta-700">
                              {isRent ? 'Rent ₹' + r.seller_asked_rental_price : 'Buy ₹' + r.seller_asked_price}
                            </div>
                          </div>
                        </div>

                        <div className="p-3 bg-linen-100/80 rounded-2xl text-xs space-y-1 border border-linen-200">
                          <div className="font-bold text-forest">Seller Contact:</div>
                          <div className="text-forest font-medium">{r.seller_name} &bull; <span className="text-emerald-700 font-bold">{r.seller_phone}</span></div>
                          <div className="text-sage-600 text-[11px]">{r.seller_email}</div>
                        </div>
                      </div>

                      {/* Calibration & Approval Form */}
                      <div className="lg:col-span-4 bg-linen-50/90 p-6 rounded-3xl border border-linen-300 space-y-4">
                        <div className="border-b border-linen-200 pb-2">
                          <span className="text-[10px] font-bold uppercase tracking-wider text-terracotta-700">Operations Calibration</span>
                          <div className="text-xs font-semibold text-forest">Calibrate Live Selling Prices</div>
                        </div>

                        {!isRent && (
                          <div>
                            <label className="block text-[11px] font-semibold text-forest mb-1">
                              Approved Resale Price (₹) <span className="text-sage-500 font-normal">(Seller asked ₹{r.seller_asked_price})</span>
                            </label>
                            <div className="relative">
                              <span className="absolute left-3.5 top-2.5 text-xs font-bold text-sage-600">₹</span>

            <div className="flex items-center gap-3 pt-2">
              <button
                onClick={onClose}
                className="flex-1 py-3 bg-linen-100 hover:bg-linen-200 text-forest font-semibold rounded-xl text-xs transition-all border border-linen-300"
              >
                Cancel
              </button>
              <button
                onClick={onConfirm}
                className="flex-1 py-3 bg-red-700 hover:bg-red-800 text-white font-semibold rounded-xl text-xs transition-all shadow-xs flex items-center justify-center gap-1.5"
              >
                <span>Confirm Rejection</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

      const [imgUrl, setImgUrl] = useState('https://images.unsplash.com/photo-1610030469983-98e550d6193c?q=80&w=700&auto=format&fit=crop');

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 bg-forest/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-3xl border border-linen-300 max-w-2xl w-full p-6 sm:p-8 space-y-6 shadow-2xl my-8 animate-fadeIn">
            
            <div className="flex items-center justify-between border-b border-linen-200 pb-3">
              <div className="flex items-center gap-2.5">
                <span className="w-8 h-8 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold text-sm">
                  +
                </span>
                <div>
                  <h3 className="font-serif text-2xl text-forest">Quick List Consignment Piece</h3>
                  <p className="text-[11px] text-sage-600">Directly publish a curated piece into the live circular catalog</p>
                </div>
              </div>
              <button onClick={onClose} className="text-sage-400 hover:text-forest p-1 rounded-full text-base">
                ✕
              </button>
            </div>

            <form onSubmit={onSubmit} className="space-y-4 text-xs">
              <div>

                <input
                  name="title"

                  className="w-full px-3.5 py-2.5 rounded-xl border border-linen-300 bg-linen-50/50 text-forest focus:outline-none focus:border-sage-500 font-sans"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block font-semibold uppercase tracking-wider text-forest/80 mb-1">Wardrobe Category</label>
                  <select name="category" className="w-full px-3.5 py-2.5 rounded-xl border border-linen-300 bg-white text-forest focus:outline-none focus:border-sage-500 font-medium">
                    <option value="lehenga">Heavy Lehenga (Rental / Bridal)</option>
                    <option value="gown">Evening Gala Gown (Rental)</option>
                    <option value="sharara">Heavy Sharara / Gharara (Rental)</option>
                    <option value="saree">Heritage Silk Saree (Buy / Rent)</option>
                    <option value="kurta">Kurta Set &amp; Semi-Heavy Ethnic</option>
                    <option value="mens">Men's Wardrobe (Sherwani / Blazer / Shirt)</option>
                    <option value="dress">Casual &amp; Midi Dress</option>
                    <option value="top">Daily Top / Blouse</option>
                    <option value="skirt">Pleated / Denim Skirt</option>
                    <option value="blazer">Tailored &amp; Upcycled Blazer</option>
                    <option value="occasion">Indo-Western Partywear</option>
                  </select>
                </div>
                <div>
                  <label className="block font-semibold uppercase tracking-wider text-forest/80 mb-1">Listing Preference</label>
                  <select name="listing_mode" defaultValue="both" className="w-full px-3.5 py-2.5 rounded-xl border border-linen-300 bg-white text-forest focus:outline-none focus:border-sage-500 font-medium">
                    <option value="rent">Rent Only (Listed under Occasion Rentals)</option>
                    <option value="buy">Sell Only (Listed under Buy Pre-Loved)</option>
                    <option value="both">Both (Can be Bought OR Rented)</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label className="block font-semibold uppercase tracking-wider text-forest/80 mb-1">Retail MRP (₹)</label>
                  <input name="mrp" type="number" required defaultValue="45000" className="w-full px-3.5 py-2.5 rounded-xl border border-linen-300 bg-linen-50/50 text-forest focus:outline-none focus:border-sage-500 font-mono" />
                </div>
                <div>
                  <label className="block font-semibold uppercase tracking-wider text-forest/80 mb-1">Resale Buy Price (₹)</label>
                  <input name="price" type="number" defaultValue="4999" className="w-full px-3.5 py-2.5 rounded-xl border border-linen-300 bg-linen-50/50 text-forest focus:outline-none focus:border-sage-500 font-mono" />
                </div>
                <div>
                  <label className="block font-semibold uppercase tracking-wider text-forest/80 mb-1">3-Day Rental Price (₹)</label>
                  <input name="rental" type="number" defaultValue="2499" className="w-full px-3.5 py-2.5 rounded-xl border border-linen-300 bg-linen-50/50 text-forest focus:outline-none focus:border-sage-500 font-mono" />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label className="block font-semibold uppercase tracking-wider text-forest/80 mb-1">Size</label>
                  <input name="size" required defaultValue="M (Adjustable)" className="w-full px-3.5 py-2.5 rounded-xl border border-linen-300 bg-linen-50/50 text-forest focus:outline-none focus:border-sage-500" />
                </div>
                <div>
                  <label className="block font-semibold uppercase tracking-wider text-forest/80 mb-1">Condition</label>
                  <select name="condition" defaultValue="Pristine Consignment" className="w-full px-3.5 py-2.5 rounded-xl border border-linen-300 bg-white text-forest focus:outline-none focus:border-sage-500">
                    <option value="Pristine Consignment">Pristine Consignment</option>
                    <option value="Like New (Pristine)">Like New (Pristine)</option>
                    <option value="Gently Loved">Gently Loved</option>
                  </select>
                </div>
                <div>
                  <label className="block font-semibold uppercase tracking-wider text-forest/80 mb-1">Fabric</label>
                  <input name="fabric" required defaultValue="Pure Silk &amp; Zardozi Embroidery" className="w-full px-3.5 py-2.5 rounded-xl border border-linen-300 bg-linen-50/50 text-forest focus:outline-none focus:border-sage-500" />
                </div>
              </div>

              <div>
                <label className="block font-semibold uppercase tracking-wider text-forest/80 mb-1">Image URL</label>
                <input
                  name="image"
                  value={imgUrl}
                  onChange={(e) => setImgUrl(e.target.value)}
                  required
                  className="w-full px-3.5 py-2.5 rounded-xl border border-linen-300 bg-linen-50/50 text-forest focus:outline-none focus:border-sage-500 font-mono text-[11px]"
                />
                <div className="flex items-center gap-1.5 mt-1.5 overflow-x-auto no-scrollbar">
                  <span className="text-[10px] text-sage-600 font-semibold shrink-0">Presets:</span>
                  <button type="button" onClick={() => setImgUrl('https://images.unsplash.com/photo-1610030469983-98e550d6193c?q=80&w=700&auto=format&fit=crop')} className="px-2 py-0.5 rounded bg-linen-100 hover:bg-linen-200 text-[10px] text-forest shrink-0">Lehenga</button>
                  <button type="button" onClick={() => setImgUrl('https://images.unsplash.com/photo-1566174053879-31528523f8ae?q=80&w=700&auto=format&fit=crop')} className="px-2 py-0.5 rounded bg-linen-100 hover:bg-linen-200 text-[10px] text-forest shrink-0">Gala Gown</button>
                  <button type="button" onClick={() => setImgUrl('https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?q=80&w=700&auto=format&fit=crop')} className="px-2 py-0.5 rounded bg-linen-100 hover:bg-linen-200 text-[10px] text-forest shrink-0">Sharara</button>
                  <button type="button" onClick={() => setImgUrl('https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=700&auto=format&fit=crop')} className="px-2 py-0.5 rounded bg-linen-100 hover:bg-linen-200 text-[10px] text-forest shrink-0">Silk Saree</button>
                  <button type="button" onClick={() => setImgUrl('https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=700&auto=format&fit=crop')} className="px-2 py-0.5 rounded bg-linen-100 hover:bg-linen-200 text-[10px] text-forest shrink-0">Men's Sherwani</button>
                </div>
              </div>

              <div className="flex items-center gap-3 pt-3 border-t border-linen-200">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-3 bg-linen-100 hover:bg-linen-200 text-forest font-semibold rounded-xl text-xs transition-all border border-linen-300"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="flex-1 py-3 bg-forest hover:bg-sage-900 text-white font-semibold rounded-xl text-xs transition-all shadow-md flex items-center justify-center gap-1.5"
                >
                  <span>Publish Directly to Store</span>
                </button>
              </div>
            </form>

          </div>
        </div>
      );
    }

    // ========================================================
    // 8. ROOT MANAGEMENT APP (REACT APPLICATION)
    // ========================================================
    function AdminApp() {
      const [activeTab, setActiveTab] = useState('approvals');
      const [pendingRequests, setPendingRequests] = useState([]);
      const [orders, setOrders] = useState([]);
      const [inventory, setInventory] = useState([]);
      const [atelierRequests, setAtelierRequests] = useState([]);
      const [donationRequests, setDonationRequests] = useState([]);
      const [stats, setStats] = useState({
        active_inventory_count: 24,
        pending_approvals_count: 3,
        total_orders_count: 2,
        total_gmv_inr: 48250,
        platform_commission_inr: 10615
      });

      // Filter States
      const [pendingSearch, setPendingSearch] = useState('');
      const [pendingFilterMode, setPendingFilterMode] = useState('all');
      const [orderSearch, setOrderSearch] = useState('');
      const [inventorySearch, setInventorySearch] = useState('');
      const [inventoryCategory, setInventoryCategory] = useState('all');

      // Modals
      const [isQuickConsignOpen, setIsQuickConsignOpen] = useState(false);
      const [rejectingItem, setRejectingItem] = useState(null);
      const [rejectPreset, setRejectPreset] = useState('Fabric damage / tear / unrepairable stains detected');
      const [rejectNotes, setRejectNotes] = useState('');

      // Toast
      const [toast, setToast] = useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Data Load
      const loadAllData = async () => {
        try {
          const [resPend, resOrd, resInv, resAtl, resDon, resStat] = await Promise.all([
            fetch('/api/admin/pending-requests').then(r => r.json()).catch(() => ({ pending: [] })),
            fetch('/api/orders').then(r => r.json()).catch(() => ({ orders: [] })),
            fetch('/api/products?mode=all').then(r => r.json()).catch(() => ({ products: [] })),
            fetch('/api/atelier-requests').then(r => r.json()).catch(() => ({ requests: [] })),
            fetch('/api/donation-requests').then(r => r.json()).catch(() => ({ donations: [] })),
            fetch('/api/admin/stats').then(r => r.json()).catch(() => ({ stats: {} }))
          ]);

          if (resPend.pending) setPendingRequests(resPend.pending);
          if (resOrd.orders) setOrders(resOrd.orders);
          if (resInv.products) setInventory(resInv.products);
          if (resAtl.requests) setAtelierRequests(resAtl.requests);
          if (resDon.donations) setDonationRequests(resDon.donations);
          if (resStat.stats) setStats(resStat.stats);
        } catch (e) {
          console.error(e);
        }
      };

      useEffect(() => {
        loadAllData();
      }, []);

      // Handlers
      const handleApprove = async (requestId, approvedPrice, approvedRental, adminNotes) => {
        try {
          const res = await fetch('/api/admin/approve-request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              requestId,
              approved_price: approvedPrice,
              approved_rental_price: approvedRental,
              admin_notes: adminNotes
            })
          });
          const data = await res.json();
          if (data.success) {
            showToast('Approved & published live to customer storefront!');
            loadAllData();
          } else {
            showToast('Error: ' + data.error);
          }
        } catch (e) {
          showToast('Approval error: ' + e.message);
        }
      };

      const handleConfirmRejection = async () => {
        if (!rejectingItem) return;
        const reason = rejectNotes.trim() ? `${rejectPreset} — Note: ${rejectNotes.trim()}` : rejectPreset;
        try {
          const res = await fetch('/api/admin/reject-request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ requestId: rejectingItem.id, reason })
          });
          const data = await res.json();
          if (data.success) {
            showToast('Submission rejected and archived.');
            setRejectingItem(null);
            setRejectNotes('');
            loadAllData();
          }
        } catch (e) {
          showToast('Rejection error');
        }
      };

      const handleQuickConsignSubmit = async (e) => {
        e.preventDefault();
        const f = e.target;
        const payload = {
          title: f.title.value,
          category: f.category.value,
          listing_mode: f.listing_mode.value,
          mrp: Number(f.mrp.value),
          price: Number(f.price.value || 0),
          rental_price_3_day: Number(f.rental.value || 0),
          size: f.size.value,
          condition: f.condition.value,
          fabric: f.fabric.value,
          image: f.image.value,
          seller: 'Revive Operations Consignment ⭐ 5.0'
        };

        try {
          const res = await fetch('/api/admin/quick-add-product', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.success) {
            showToast('Garment directly listed live to storefront!');
            setIsQuickConsignOpen(false);
            loadAllData();
          }
        } catch (err) {
          showToast('Failed to add garment');
        }
      };

      const handleUpdateOrderStatus = async (orderId, newStatus) => {
        try {
          const res = await fetch('/api/admin/orders/update-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId, status: newStatus })
          });
          const data = await res.json();
          if (data.success) {
            showToast('Order status updated: ' + newStatus);
            loadAllData();
          }
        } catch (e) {
          showToast('Update failed');
        }
      };

      // Filtered lists
      const filteredPending = useMemo(() => {
        return pendingRequests.filter(r => {
          if (pendingFilterMode !== 'all' && r.listing_mode !== pendingFilterMode) return false;
          if (pendingSearch.trim()) {
            const q = pendingSearch.toLowerCase();
            return r.title.toLowerCase().includes(q) || r.seller_name.toLowerCase().includes(q) || r.seller_phone.includes(q);
          }
          return true;
        });
      }, [pendingRequests, pendingFilterMode, pendingSearch]);

      const filteredOrders = useMemo(() => {
        if (!orderSearch.trim()) return orders;
        const q = orderSearch.toLowerCase();
        return orders.filter(o => 
          o.id.toLowerCase().includes(q) || 
          o.customer_name.toLowerCase().includes(q) || 
          o.customer_phone.includes(q) ||
          o.item_title.toLowerCase().includes(q)
        );
      }, [orders, orderSearch]);

      const filteredInventory = useMemo(() => {
        return inventory.filter(p => {
          if (inventoryCategory !== 'all') {
            if (inventoryCategory === 'top') {
              if (p.category !== 'top' && p.category !== 'skirt') return false;
            } else if (p.category !== inventoryCategory) {
              return false;
            }
          }
          if (inventorySearch.trim()) {
            const q = inventorySearch.toLowerCase();
            return p.title.toLowerCase().includes(q) || (p.fabric && p.fabric.toLowerCase().includes(q)) || (p.seller && p.seller.toLowerCase().includes(q));
          }
          return true;
        });
      }, [inventory, inventoryCategory, inventorySearch]);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-forest text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-sage-700 flex items-center gap-3 animate-fadeIn">
              <span className="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-xs">✓</span>
              <span className="text-xs font-semibold">{toast}</span>
            </div>
          )}

          <div>
            <AdminNavbar
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              pendingCount={pendingRequests.length}
              ordersCount={orders.length}
              inventoryCount={inventory.length}
              onOpenQuickConsign={() => setIsQuickConsignOpen(true)}
            />

            <KpiMetrics stats={stats} />

            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
              {activeTab === 'approvals' && (
                <ApprovalsTab
                  pendingRequests={filteredPending}
                  pendingFilterMode={pendingFilterMode}
                  setPendingFilterMode={setPendingFilterMode}
                  pendingSearch={pendingSearch}
                  setPendingSearch={setPendingSearch}
                  onRefresh={loadAllData}
                  onApprove={handleApprove}
                  onOpenRejectModal={(item) => setRejectingItem(item)}
                  onOpenQuickConsign={() => setIsQuickConsignOpen(true)}
                />
              )}

              {activeTab === 'orders' && (
                <OrdersTab
                  orders={filteredOrders}
                  search={orderSearch}
                  onSearchChange={setOrderSearch}
                  onRefresh={loadAllData}
                  onUpdateStatus={handleUpdateOrderStatus}
                />
              )}

              {activeTab === 'inventory' && (
                <InventoryTab
                  inventory={filteredInventory}
                  search={inventorySearch}
                  onSearchChange={setInventorySearch}
                  category={inventoryCategory}
                  onCategoryChange={setInventoryCategory}
                  onOpenQuickConsign={() => setIsQuickConsignOpen(true)}
                />
              )}

              {activeTab === 'atelier' && (
                <AtelierDonationsTab
                  atelierRequests={atelierRequests}
                  donationRequests={donationRequests}
                />
              )}
            </main>
          </div>

          <RejectModal
            isOpen={!!rejectingItem}
            item={rejectingItem}
            preset={rejectPreset}
            setPreset={setRejectPreset}
            notes={rejectNotes}
            setNotes={setRejectNotes}
            onClose={() => setRejectingItem(null)}
            onConfirm={handleConfirmRejection}
          />

          <QuickConsignModal
            isOpen={isQuickConsignOpen}
            onClose={() => setIsQuickConsignOpen(false)}
            onSubmit={handleQuickConsignSubmit}
          />

          <footer className="bg-forest text-linen-300 text-xs py-5 border-t border-sage-800 text-center space-y-1">
            <div className="font-medium text-white">Revive Threads React Operations &amp; Management Engine &bull; Real-time Verification &amp; Catalog Engine</div>
            <div className="text-[11px] text-sage-400">Sakshi Kore &bull; Arpita Jadhav &bull; Yashika Thakur &bull; Circular Fashion Portfolio Venture</div>
          </footer>

        </div>
      );
    }

    // Mount to DOM
    ReactDOM.createRoot(document.getElementById('admin-root')).render(<AdminApp />);
  </script>
</body>
