<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 750' width='1200' height='750'>
  <defs>
    <linearGradient id='reviveBg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#FAF7F2' />
      <stop offset='50%' stop-color='#F3EEE6' />
      <stop offset='100%' stop-color='#E6DFD5' />
    </linearGradient>
    <filter id='dropSoft' x='-10%' y='-10%' width='130%' height='130%'>
      <feDropShadow dx='0' dy='14' stdDeviation='20' flood-color='#203126' flood-opacity='0.18' />
    </filter>
  </defs>

  <rect width='1200' height='750' fill='url(#reviveBg)' />
  
  <!-- Warm Terracotta & Sage Botanical Circles -->
  <circle cx='960' cy='200' r='260' fill='#D48B77' opacity='0.18' />
  <circle cx='220' cy='550' r='280' fill='#6B8572' opacity='0.14' />

  <!-- LAPTOP FRAME -->
  <g filter='url(#dropSoft)'>
    <rect x='100' y='110' width='720' height='450' rx='18' fill='#203126' stroke='#374B3E' stroke-width='3' />
    <rect x='114' y='124' width='692' height='422' rx='10' fill='#FAF7F2' />
    
    <!-- Top Nav Header -->
    <rect x='114' y='124' width='692' height='48' fill='#6B8572' />
    <circle cx='138' cy='148' r='5' fill='#D48B77' />
    <circle cx='154' cy='148' r='5' fill='#E2EAE6' />
    <circle cx='170' cy='148' r='5' fill='#FAF7F2' />

    <text x='200' y='154' fill='#FAF7F2' font-family='Georgia, serif' font-style='italic' font-weight='700' font-size='16'>REVIVE THREADS</text>
    <text x='355' y='152' fill='#E2EAE6' font-family='system-ui, sans-serif' font-size='10' letter-spacing='1'>CIRCULAR FASHION ECOSYSTEM</text>
    
    <rect x='670' y='136' width='120' height='24' rx='12' fill='#D48B77' />
    <text x='730' y='152' fill='#FFFFFF' font-family='system-ui, sans-serif' font-weight='600' font-size='10' text-anchor='middle'>+ List Garment</text>

    <!-- Hero Banner Inside Laptop -->
    <rect x='134' y='188' width='652' height='110' rx='12' fill='#D48B77' />
    <text x='160' y='230' fill='#FAF7F2' font-family='Georgia, serif' font-size='22' font-weight='700'>Ending Fast-Fashion Waste.</text>
    <text x='160' y='254' fill='#FFE3DA' font-family='system-ui, sans-serif' font-size='11'>Buy Verified Thrift • Rent Couture • Upcycle Heirlooms • Doorstep NGO Donation</text>
    <rect x='160' y='268' width='120' height='20' rx='10' fill='#203126' />
    <text x='220' y='282' fill='#FAF7F2' font-family='system-ui, sans-serif' font-size='9' font-weight='700' text-anchor='middle'>Explore 4 Modes</text>

    <!-- Garment Cards in Laptop -->
    <g transform='translate(134, 314)'>
      <!-- Card 1: Thrift -->
      <rect x='0' y='0' width='206' height='215' rx='10' fill='#FFFFFF' stroke='#E2D9CC' stroke-width='1' />
      <rect x='10' y='10' width='186' height='120' rx='8' fill='#E2EAE6' />
      <text x='103' y='75' fill='#6B8572' font-family='Georgia, serif' font-size='28' text-anchor='middle'>👗</text>
      <rect x='18' y='18' width='55' height='16' rx='8' fill='#6B8572' />
      <text x='45' y='29' fill='#FFFFFF' font-family='system-ui, sans-serif' font-size='8' font-weight='700' text-anchor='middle'>THRIFT</text>
      <text x='14' y='150' fill='#203126' font-family='system-ui, sans-serif' font-weight='700' font-size='12'>Vintage Linen Blazer</text>
      <text x='14' y='168' fill='#8C7A6B' font-family='system-ui, sans-serif' font-size='10'>65% off retail • Escrow safe</text>
      <text x='14' y='194' fill='#D48B77' font-family='system-ui, sans-serif' font-weight='800' font-size='14'>₹1,499</text>

      <!-- Card 2: Rent -->
      <rect x='222' y='0' width='206' height='215' rx='10' fill='#FFFFFF' stroke='#E2D9CC' stroke-width='1' />
      <rect x='232' y='10' width='186' height='120' rx='8' fill='#F5EBE6' />
      <text x='325' y='75' fill='#D48B77' font-family='Georgia, serif' font-size='28' text-anchor='middle'>✨</text>
      <rect x='240' y='18' width='55' height='16' rx='8' fill='#D48B77' />
      <text x='267' y='29' fill='#FFFFFF' font-family='system-ui, sans-serif' font-size='8' font-weight='700' text-anchor='middle'>RENT</text>
      <text x='236' y='150' fill='#203126' font-family='system-ui, sans-serif' font-weight='700' font-size='12'>Bridal Heritage Lehenga</text>
      <text x='236' y='168' fill='#8C7A6B' font-family='system-ui, sans-serif' font-size='10'>Medical sanitization • 4 Days</text>
      <text x='236' y='194' fill='#6B8572' font-family='system-ui, sans-serif' font-weight='800' font-size='14'>₹3,800 <tspan font-size='10' font-weight='normal'>/ 4 days</tspan></text>

      <!-- Card 3: Atelier Upcycling -->
      <rect x='444' y='0' width='206' height='215' rx='10' fill='#FFFFFF' stroke='#E2D9CC' stroke-width='1' />
      <rect x='454' y='10' width='186' height='120' rx='8' fill='#EFECE6' />
      <text x='547' y='75' fill='#C8A97E' font-family='Georgia, serif' font-size='28' text-anchor='middle'>🧵</text>
      <rect x='462' y='18' width='60' height='16' rx='8' fill='#C8A97E' />
      <text x='492' y='29' fill='#FFFFFF' font-family='system-ui, sans-serif' font-size='8' font-weight='700' text-anchor='middle'>ATELIER</text>
      <text x='458' y='150' fill='#203126' font-family='system-ui, sans-serif' font-weight='700' font-size='12'>Saree to Modern Co-Ord</text>
      <text x='458' y='168' fill='#8C7A6B' font-family='system-ui, sans-serif' font-size='10'>Vetted Master Tailor Custom</text>
      <text x='458' y='194' fill='#203126' font-family='system-ui, sans-serif' font-weight='800' font-size='14'>Quote on Request</text>
    </g>

    <!-- Laptop Base -->
    <polygon points='30,560 890,560 850,578 70,578' fill='#203126' />
    <rect x='410' y='560' width='100' height='7' rx='3.5' fill='#374B3E' />
  </g>

  <!-- MOBILE FRAME (Right) -->
  <g filter='url(#dropSoft)' transform='translate(830, 130)'>
    <rect x='0' y='0' width='280' height='550' rx='42' fill='#203126' stroke='#374B3E' stroke-width='3.5' />
    <rect x='10' y='10' width='260' height='530' rx='34' fill='#FAF7F2' />
    
    <rect x='95' y='22' width='90' height='22' rx='11' fill='#203126' />
    
    <!-- Mobile App Header -->
    <text x='140' y='78' fill='#203126' font-family='Georgia, serif' font-style='italic' font-weight='700' font-size='18' text-anchor='middle'>Revive Threads</text>
    <rect x='25' y='95' width='230' height='75' rx='12' fill='#D48B77' />
    <text x='40' y='125' fill='#FAF7F2' font-family='Georgia, serif' font-size='14' font-weight='700'>Circular Wardrobe</text>
    <text x='40' y='145' fill='#FFE3DA' font-family='system-ui, sans-serif' font-size='9'>Doorstep NGO pickup &amp; 80G tax receipt</text>

    <!-- Garment Card in Mobile -->
    <rect x='25' y='185' width='230' height='130' rx='12' fill='#FFFFFF' stroke='#E2D9CC' stroke-width='1' />
    <rect x='35' y='195' width='90' height='110' rx='8' fill='#E2EAE6' />
    <text x='80' y='255' fill='#6B8572' font-size='22' text-anchor='middle'>👗</text>
    <text x='135' y='215' fill='#203126' font-family='system-ui, sans-serif' font-weight='700' font-size='11'>Embroidered Kurta</text>
    <text x='135' y='232' fill='#8C7A6B' font-family='system-ui, sans-serif' font-size='9'>Condition: Like New</text>
    <text x='135' y='254' fill='#D48B77' font-family='system-ui, sans-serif' font-weight='800' font-size='13'>₹899</text>
    <rect x='135' y='270' width='80' height='22' rx='11' fill='#6B8572' />
    <text x='175' y='285' fill='#FFFFFF' font-family='system-ui, sans-serif' font-size='9' font-weight='700' text-anchor='middle'>Rent / Buy</text>

    <!-- Second Card in Mobile -->
    <rect x='25' y='330' width='230' height='130' rx='12' fill='#FFFFFF' stroke='#E2D9CC' stroke-width='1' />
    <rect x='35' y='340' width='90' height='110' rx='8' fill='#F5EBE6' />
    <text x='80' y='400' fill='#D48B77' font-size='22' text-anchor='middle'>✨</text>
    <text x='135' y='360' fill='#203126' font-family='system-ui, sans-serif' font-weight='700' font-size='11'>Silk Banarasi Dupatta</text>
    <text x='135' y='377' fill='#8C7A6B' font-family='system-ui, sans-serif' font-size='9'>NGO Upcycled Edition</text>
    <text x='135' y='399' fill='#6B8572' font-family='system-ui, sans-serif' font-weight='800' font-size='13'>₹1,250</text>
  </g>
</svg>