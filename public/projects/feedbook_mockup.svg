        <rect x='214' y='18' width='38' height='16' rx='4' fill='#ECEFF1' />
        
        <rect x='16' y='54' width='234' height='6' rx='2' fill='#78909C' />
        <rect x='16' y='66' width='180' height='6' rx='2' fill='#B0BEC5' />
        
        <!-- Score Bar Matrix -->
        <rect x='16' y='86' width='70' height='36' rx='6' fill='#ECEFF1' />
        <rect x='24' y='94' width='40' height='8' rx='2' fill='#546E7A' />
        <rect x='24' y='106' width='50' height='8' rx='2' fill='#90A4AE' />
        
        <rect x='94' y='86' width='70' height='36' rx='6' fill='#ECEFF1' />
