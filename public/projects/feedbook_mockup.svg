<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 750' width='1200' height='750'>
  <defs>
    <linearGradient id='feedbookBg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#FAF5FF' />
      <stop offset='50%' stop-color='#F3E8FF' />
      <stop offset='100%' stop-color='#E9D5FF' />
    </linearGradient>
    <linearGradient id='purpleGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#7B2CBF' />
      <stop offset='100%' stop-color='#9D4EDD' />
    </linearGradient>
    <filter id='dropCard' x='-10%' y='-10%' width='130%' height='130%'>
      <feDropShadow dx='0' dy='12' stdDeviation='18' flood-color='#4A154B' flood-opacity='0.16' />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width='1200' height='750' fill='url(#feedbookBg)' />
  
  <!-- Subtle Designer Grid Background -->
  <g opacity='0.08'>
    <pattern id='gridPattern' width='40' height='40' patternUnits='userSpaceOnUse'>
      <path d='M 40 0 L 0 0 0 40' fill='none' stroke='#7B2CBF' stroke-width='1' />
    </pattern>
    <rect width='1200' height='750' fill='url(#gridPattern)' />
  </g>

  <!-- Ambient Blurred Glows -->
  <circle cx='200' cy='180' r='240' fill='#C77DFF' opacity='0.15' />
  <circle cx='1050' cy='580' r='280' fill='#7B2CBF' opacity='0.12' />

  <!-- Top Header Title Ribbon -->
  <g transform='translate(60, 40)'>
    <rect x='0' y='0' width='380' height='36' rx='18' fill='#FFFFFF' stroke='#E9D5FF' stroke-width='1.5' filter='url(#dropCard)' />
    <circle cx='20' cy='18' r='6' fill='#7B2CBF' />
    <text x='36' y='22' fill='#5A189A' font-family='system-ui, sans-serif' font-weight='700' font-size='12' letter-spacing='0.5'>FEEDBOOK • FIGMA UI/UX CASE STUDY</text>
    <rect x='280' y='6' width='90' height='24' rx='12' fill='#7B2CBF' />
    <text x='325' y='22' fill='#FFFFFF' font-family='system-ui, sans-serif' font-weight='700' font-size='10' text-anchor='middle'>3 FIDELITIES</text>
  </g>

  <!-- 3 TIERS OF FIDELITY SIDE-BY-SIDE PANELS -->

  <!-- ========================================== -->
  <!-- 1. LOW-FIDELITY PANEL (Paper & Architecture) -->
  <!-- ========================================== -->
  <g transform='translate(60, 95)' filter='url(#dropCard)'>
    <!-- Panel Container -->
    <rect x='0' y='0' width='330' height='580' rx='16' fill='#FCFAF7' stroke='#D4C3B3' stroke-width='1.5' stroke-dasharray='4 4' />
    
    <!-- Header -->
    <rect x='16' y='16' width='110' height='24' rx='6' fill='#EADBC8' />
    <text x='71' y='32' fill='#5D4037' font-family='system-ui, sans-serif' font-weight='800' font-size='10' text-anchor='middle'>1. LOW-FIDELITY</text>
    <text x='138' y='32' fill='#8D6E63' font-family='system-ui, sans-serif' font-size='10'>Paper Sketches &amp; IA</text>
    
    <!-- Sketch 1: User Journey Flow Map -->
    <g transform='translate(16, 56)'>
      <rect x='0' y='0' width='298' height='150' rx='10' fill='#FFFFFF' stroke='#E0D7CE' stroke-width='1' />
      <text x='14' y='24' fill='#795548' font-family='monospace' font-size='10' font-weight='bold'>// USER FLOW &amp; JOURNEY MAP</text>
      
      <!-- Flow Nodes (Hand-drawn look) -->
      <rect x='14' y='42' width='60' height='36' rx='6' fill='#F5EBE6' stroke='#8D6E63' stroke-width='1.5' />
      <text x='44' y='64' fill='#5D4037' font-family='system-ui, sans-serif' font-size='9' font-weight='bold' text-anchor='middle'>Discover</text>
      
      <!-- Arrow -->
      <path d='M 74 60 L 98 60 M 94 56 L 98 60 L 94 64' fill='none' stroke='#8D6E63' stroke-width='1.5' stroke-linecap='round' />
      
      <rect x='100' y='42' width='80' height='36' rx='6' fill='#F5EBE6' stroke='#8D6E63' stroke-width='1.5' />
      <text x='140' y='64' fill='#5D4037' font-family='system-ui, sans-serif' font-size='9' font-weight='bold' text-anchor='middle'>Prompt Card</text>
      
      <!-- Arrow -->
      <path d='M 180 60 L 204 60 M 200 56 L 204 60 L 200 64' fill='none' stroke='#8D6E63' stroke-width='1.5' stroke-linecap='round' />
      
      <rect x='206' y='42' width='78' height='36' rx='6' fill='#F5EBE6' stroke='#8D6E63' stroke-width='1.5' />
      <text x='245' y='64' fill='#5D4037' font-family='system-ui, sans-serif' font-size='9' font-weight='bold' text-anchor='middle'>Micro-Review</text>
      
      <!-- Journey Notes -->
      <line x1='14' y1='98' x2='284' y2='98' stroke='#E0D7CE' stroke-dasharray='2 2' />
      <text x='14' y='116' fill='#8D6E63' font-family='system-ui, sans-serif' font-size='9'>• Friction point: Multi-field questionnaires cause 78% dropoff</text>
      <text x='14' y='134' fill='#8D6E63' font-family='system-ui, sans-serif' font-size='9'>• Hypothesis: Single-tap sentiment cards double participation</text>
    </g>

    <!-- Sketch 2: Rough Wireframe Sketch -->
    <g transform='translate(16, 222)'>
      <rect x='0' y='0' width='298' height='230' rx='10' fill='#FFFFFF' stroke='#E0D7CE' stroke-width='1' />
      <text x='14' y='24' fill='#795548' font-family='monospace' font-size='10' font-weight='bold'>// PAPER WIREFRAME PROTOTYPE</text>
      
      <!-- Rough sketch box -->
      <rect x='14' y='38' width='270' height='36' rx='6' fill='#F9F6F0' stroke='#A1887F' stroke-width='1.2' stroke-dasharray='3 3' />
      <line x1='28' y1='56' x2='90' y2='56' stroke='#A1887F' stroke-width='3' stroke-linecap='round' />
      <circle cx='260' cy='56' r='10' fill='#D7CCC8' />
      
      <!-- Rough Question Card -->
      <rect x='14' y='86' width='270' height='120' rx='6' fill='#F9F6F0' stroke='#A1887F' stroke-width='1.2' stroke-dasharray='3 3' />
      <line x1='28' y1='106' x2='200' y2='106' stroke='#8D6E63' stroke-width='3' stroke-linecap='round' />
      <line x1='28' y1='122' x2='150' y2='122' stroke='#BCAAA4' stroke-width='2' stroke-linecap='round' />
      
      <!-- 3 Rating Pills -->
      <rect x='28' y='142' width='60' height='26' rx='13' fill='#EFEBE9' stroke='#8D6E63' stroke-width='1' />
      <circle cx='44' cy='155' r='5' fill='#8D6E63' />
      <rect x='98' y='142' width='60' height='26' rx='13' fill='#EFEBE9' stroke='#8D6E63' stroke-width='1' />
      <circle cx='114' cy='155' r='5' fill='#8D6E63' />
      <rect x='168' y='142' width='60' height='26' rx='13' fill='#EFEBE9' stroke='#8D6E63' stroke-width='1' />
      <circle cx='184' cy='155' r='5' fill='#8D6E63' />
    </g>

    <!-- Bottom Low-Fi Takeaways -->
    <g transform='translate(16, 468)'>
      <rect x='0' y='0' width='298' height='94' rx='8' fill='#F5EBE6' />
      <text x='14' y='22' fill='#5D4037' font-family='system-ui, sans-serif' font-weight='700' font-size='10'>KEY LOW-FI VALIDATIONS:</text>
      <text x='14' y='42' fill='#6D4C41' font-family='system-ui, sans-serif' font-size='9'>✓ Isolated 3 essential feedback dimensions</text>
      <text x='14' y='60' fill='#6D4C41' font-family='system-ui, sans-serif' font-size='9'>✓ Eliminated 6 redundant form fields</text>
      <text x='14' y='78' fill='#6D4C41' font-family='system-ui, sans-serif' font-size='9'>✓ Cut completion time from 4 mins to 35 secs</text>
    </g>
  </g>

